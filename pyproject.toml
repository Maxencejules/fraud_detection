[project]
name = "fraud-detection"
version = "1.0.0"
description = "Real-time card fraud detection: Kafka streaming features, a Redis online feature store, MLflow-managed model serving and Evidently monitoring."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Private :: Do Not Upload",
]
dependencies = [
    "numpy>=2.1",
    "prometheus-client>=0.21",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
# Kafka/Redis workers: producer, feature processor, scorer.
stream = [
    "confluent-kafka>=2.8",
    "httpx>=0.28",
    "redis[hiredis]>=5.2",
]
# Online inference API.
serving = [
    "fastapi>=0.115",
    "lightgbm>=4.7",
    "mlflow-skinny>=3.4",
    "pandas>=2.2",
    "uvicorn[standard]>=0.34",
    # xgboost-cpu has no macOS wheels; the regular package does not pull CUDA libraries there.
    "xgboost-cpu>=3.0; sys_platform != 'darwin'",
    "xgboost>=3.0; sys_platform == 'darwin'",
]
# Historical simulation, Redis backfill and model training.
training = [
    "fakeredis>=2.26",
    "lightgbm>=4.7",
    "mlflow-skinny>=3.4",
    "pandas>=2.2",
    "pyarrow>=18",
    "redis[hiredis]>=5.2",
    "scikit-learn>=1.6",
    "xgboost-cpu>=3.0; sys_platform != 'darwin'",
    "xgboost>=3.0; sys_platform == 'darwin'",
]
# Drift and model-quality monitoring.
monitoring = [
    "confluent-kafka>=2.8",
    "evidently>=0.7.10",
    "mlflow-skinny>=3.4",
    "pandas>=2.2",
    "pyarrow>=18",
]

[project.scripts]
fraud-bootstrap = "fraud_detection.bootstrap:main"
fraud-feature-processor = "fraud_detection.feature_processor:main"
fraud-monitor = "fraud_detection.monitor:main"
fraud-predictor = "fraud_detection.predictor:main"
fraud-producer = "fraud_detection.producer:main"
fraud-scorer = "fraud_detection.scorer:main"
fraud-trainer = "fraud_detection.trainer:main"

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "mypy>=1.15",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_detection"]

[tool.uv]
required-version = ">=0.12"
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PT",   # flake8-pytest-style
    "RUF",  # ruff-specific
    "S",    # flake8-bandit
    "N",    # pep8-naming
    "PTH",  # prefer pathlib
    "TID",  # tidy imports
    "BLE",  # blind except
    "T20",  # no print in library code
]
ignore = [
    "S311",  # non-cryptographic RNG is intended for simulation
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]
"scripts/**" = ["T20", "S310"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "confluent_kafka.*",
    "evidently.*",
    "fakeredis.*",
    "lightgbm.*",
    "mlflow.*",
    "sklearn.*",
    "xgboost.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib", "-m", "not integration"]
markers = [
    "integration: requires the Docker Compose stack (Redis, Kafka, predictor) to be running",
]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    # Third-party noise: Evidently's UI dependency and sklearn metrics on edge windows.
    "ignore::DeprecationWarning:litestar.*",
    "ignore:.*is ill-defined and being set to 0.0.*:UserWarning",
    "ignore::SyntaxWarning:evidently.*",
    "ignore::DeprecationWarning:evidently.*",
]

[tool.coverage.run]
source = ["fraud_detection"]
branch = true
# Executed by MLflow's models-from-code loader, which coverage cannot trace
# (exercised by test_fraud_model_loads_through_mlflow_models_from_code).
omit = ["*/fraud_detection/model_code.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
