name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # weekly: new advisories and upstream drift surface without a PR

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.19"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format)
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Validate Compose file
        run: docker compose config --quiet
      - name: Dependency vulnerability audit
        # Triaged exception: GHSA-8mgp-746c-j5xp (nltk, no fixed release yet). NLTK is only a
        # transitive dependency of Evidently's text descriptors; this project never calls
        # NLTK's model-artifact APIs. Remove the ignore once a fixed nltk is available.
        run: >-
          uv audit --preview-features audit-command --locked
          --ignore GHSA-8mgp-746c-j5xp

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Unit tests with coverage gate
        run: uv run pytest --cov --cov-report=term --cov-report=xml
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14

  e2e:
    name: End-to-end (Docker Compose)
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Pinned, smaller history: deterministic data and model, faster bootstrap.
      HISTORY_END: "1767225600"
      HISTORY_DAYS: "30"
      SIM_USERS: "2000"
      EMIT_RATE_TPS: "25"
      MONITOR_REPORT_INTERVAL_S: "30"
      MONITOR_MIN_ROWS: "100"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build images
        run: docker compose build
      - name: Start the stack (bootstrap and training run first)
        run: docker compose up -d
      - name: Smoke test
        run: python3 scripts/smoke_test.py --timeout 600
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras
      - name: Integration tests
        env:
          REQUIRE_STACK: "1"
        run: uv run pytest tests/integration -m integration
      - name: Benchmark (recorded, not gated; shared runners are noisy)
        run: >-
          uv run python scripts/benchmark.py
          --requests 2000 --concurrency 8 --stream-window-s 30 --json-out benchmark.json
      - name: Upload benchmark
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark
          path: benchmark.json
          retention-days: 30
      - name: Collect diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --timestamps > compose.log
          tail -n 300 compose.log
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose-logs
          path: compose.log
          retention-days: 7
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
